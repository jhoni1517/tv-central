name: build

# A cada envio para a main: compila. Se o número no arquivo VERSION for novo,
# publica a versão em Releases, e os computadores com o TV Central se atualizam sozinhos.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Conferir código
        run: go vet ./... && GOOS=windows go vet ./... && go test ./...
      - name: Compilar para Windows
        run: |
          VERSAO="$(tr -d ' \r\n' < VERSION)"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.versao=${VERSAO}" -o dist/TVCentral.exe .
          (cd dist && sha256sum TVCentral.exe > TVCentral.exe.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: TVCentral
          path: dist/
      - name: Publicar versão nova
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            echo "v$VERSAO já publicada: nada a fazer"
          else
            gh release create "v$VERSAO" dist/TVCentral.exe dist/TVCentral.exe.sha256 \
              --title "TV Central $VERSAO" --generate-notes --target "$GITHUB_SHA"
          fi
